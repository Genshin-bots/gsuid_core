[project]
authors = [
    { name = "KimigaiiWuyi", email = "444835641@qq.com" },
    { name = "MingxuanGame", email = "MingxuanGame@outlook.com" },
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.23.0",
    # openai 3.x / anthropic 1.x 的 http_client 形参只收 httpx2 客户端, 与 httpx 不是同一套类
    "httpx2>=2.12.0",
    "beautifulsoup4>=4.11.1",
    "lxml>=4.9.2",
    "aiohttp>=3.8.1",
    "sqlalchemy<2.1.0,>=2.0.0",
    # 12 起 getdata 弃用(14 移除), 仓库改用 tobytes; 下限取实测过的 12.x
    "pillow>=12.0.0",
    "aiosqlite>=0.17.0",
    "aiofiles>=0.8.0",
    "qrcode[pil]<8.0.0,>=7.3.1",
    "msgspec>=0.13.1",
    "uvicorn>=0.20.0",
    "websockets>=13.1",
    # gs_logger 用到 starlette.websockets; 0.46 起 GZipMiddleware 才不压缩 SSE(#283)
    "starlette>=0.46.0",
    # 0.115.10 是首个允许 starlette>=0.46 的版本, 更早的 fastapi 把上限锁在 <0.39
    "fastapi>=0.115.10",
    "apscheduler<4.0.0,>=3.10.1",
    "aioboto3<13.0.0,>=12.0.0",
    "jinja2<4.0.0,>=3.1.2",
    "colorama<1.0.0,>=0.4.6",
    "async-timeout>=4.0.3",
    "typing-extensions>=4.9",
    "toml>=0.10.2",
    "bcrypt>=4.0.1,<5.0.0",
    # 0.0.14 起才支持 pydantic v2, 更早的版本与 pydantic>=2.12.2 不可能同装
    "sqlmodel>=0.0.14,<0.0.31",
    "psutil>=6.1.1",
    "pytz>=2024.2",
    "structlog>=25.3.0",
    "rich>=14.0.0",
    "cryptography>=45.0.5",
    "packaging>=25.0",
    "greenlet>=3.2.4",
    "boltons>=25.0.0",
    "openai>=2.15.0",
    "jieba>=0.42.1",
    "joblib>=1.5.3",
    "scikit-learn>=1.7.2",
    "pydantic>=2.12.2",
    "playwright>=1.58.0",
    "fastembed>=0.7.4",
    "qdrant-client>=1.17.0",
    "python-multipart>=0.0.22",
    "tavily-python>=0.7.23",
    "pydantic-ai-slim[anthropic,google,openai]>=2.54.0",
    # skills 2.x 依赖 harness>=0.52, 其本地工作区后端仅 POSIX, Windows 上构造技能能力即抛错
    "pydantic-ai-skills>=0.6.0,<1",
    "json-repair>=0.59.4",
    "exa-py>=2.12.1",
    # fastmcp.tools.base(ToolResult) 自 3.2.0 才有, 3.1 及以前叫 tools/tool.py
    "fastmcp>=3.2.0,<4",
    "markdownify>=1.2.2",
    "onnxruntime>=1.24.1",
    "pytakumi>=0.1.5",
    "firecrawl-py>=4.40.0",
    # 0.1.x 的 Usage 带 output_reasoning_tokens, 需 pydantic-ai-slim>=2.54.0 才认, 否则归零
    "genai-prices>=0.1.9",
    "pydantic-monty>=1.0.0",
]
name = "gsuid-core"
version = "0.11.1"
description = "KimigaiiWuyi/GenshinUID 的核心部分，平台无关，便于移植到其他平台以及框架。"
readme = "README.md"

[project.scripts]
core = "gsuid_core.core:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
# ruff==0.16.6 对齐 pre-commit；ASYNC240（pathlib）从 0.16 才有。
# basedpyright 放进 dev，uv sync 之后才能跑交付闸。
dev = ["ruff==0.16.6", "basedpyright==1.39.7", "pre-commit>=2.21.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.urls]
"Bug Tracker" = "https://github.com/Genshin-bots/gsuid-core/issues"
homepage = "https://github.com/Genshin-bots/gsuid-core"
repository = "https://github.com/Genshin-bots/gsuid-core"

[tool.uv]
# dev 组是默认组：交付闸的 ruff / basedpyright / pytest 靠 uv sync 装齐。
# 生产镜像与部署环境用 `uv sync --no-dev` 跳过（见 Dockerfile）。
default-groups = ["dev"]
